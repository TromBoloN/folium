name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Public values only: the build validates env vars but never calls Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      - run: bun run test
      - run: bun run build

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      # Full local stack: the migration and tests rely on the auth schema that
      # the auth service sets up. Applies every migration from scratch.
      - run: supabase start
      - run: supabase test db
